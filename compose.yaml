name: acme-widget-co

services:
  app:
    build:
      context: .
      target: runtime
    image: acme-widget-co:local
    ports:
      - '127.0.0.1:8080:8080'
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: '8080'
      STATIC_DIR: /app/apps/web/dist
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true
    pids_limit: 100
    mem_limit: 512m
    cpus: 1.0
    restart: unless-stopped
    stop_grace_period: 10s
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:8080/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
